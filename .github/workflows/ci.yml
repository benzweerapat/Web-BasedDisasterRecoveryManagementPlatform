name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run check:publish
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm --prefix backend audit --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npm audit --audit-level=moderate
