name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run check:publish
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm --prefix backend audit --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npm audit --audit-level=moderate
